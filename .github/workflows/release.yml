name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate release version
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          $version = python -c 'from comfy_launcher import __version__; print(__version__)'
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match package version' }
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python tools/make_icon.py
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean launcher.spec
      - name: Test packaged executable
        shell: pwsh
        run: |
          $env:COMFY_LAUNCHER_HOME = Join-Path $env:RUNNER_TEMP 'launcher-self-test'
          $process = Start-Process -FilePath 'dist/ComfyUI-Launcher/ComfyUI-Launcher.exe' -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged self-test failed' }
          Get-Content (Join-Path $env:COMFY_LAUNCHER_HOME 'self-test.json')
      - name: Package and checksum
        shell: pwsh
        run: |
          $name = "ComfyUI-Launcher-$env:GITHUB_REF_NAME-win64.zip"
          Copy-Item scripts/create_shortcut.ps1 dist/ComfyUI-Launcher/Create-Shortcut.ps1
          Copy-Item README.md,README.ar.md,LICENSE dist/ComfyUI-Launcher/
          Compress-Archive -Path 'dist/ComfyUI-Launcher' -DestinationPath $name
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $name).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ComfyUI-Launcher-v*-win64.zip
            SHA256SUMS.txt
