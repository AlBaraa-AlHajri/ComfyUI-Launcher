<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>ComfyUI Launcher original workflow and play icon</title>
  <desc>Two workflow nodes merge into a play node on a dark purple rounded tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1828"/>
      <stop offset="1" stop-color="#2A2238"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="220" fill="url(#tile)"/>
  <g opacity="0.20" filter="url(#glow)">
    <circle cx="690" cy="512" r="184" fill="#D8FF3E"/>
  </g>
  <g id="graph">
    <path d="M 282 290 C 470 290 404 512 550 512" fill="none" stroke="#8B7CF6" stroke-width="64" stroke-linecap="round"/>
    <path d="M 282 734 C 470 734 404 512 550 512" fill="none" stroke="#D8FF3E" stroke-width="64" stroke-linecap="round"/>
    <circle cx="282" cy="290" r="100" fill="#8B7CF6"/>
    <circle cx="282" cy="734" r="100" fill="#D8FF3E"/>
    <circle cx="690" cy="512" r="184" fill="#D8FF3E"/>
    <polygon points="646,411 646,613 800,512" fill="#211B2D"/>
  </g>
</svg>
